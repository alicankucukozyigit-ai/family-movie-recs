{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Log in</h1>
  <form method="POST">
    <label>Email
      <input type="email" name="email" required />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="form-footer">New here? <a href="{{ url_for('signup') }}">Sign up</a></p>
</section>
{% endblock %}
