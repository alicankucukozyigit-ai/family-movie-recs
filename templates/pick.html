{% extends "base.html" %}
{% block title %}Pick a Movie{% endblock %}
{% block content %}
<section>
  <h1>Who's watching tonight?</h1>
  <form method="POST" action="{{ url_for('results') }}">
    <div class="member-grid picker">
      {% for member in members %}
        <label class="member-tile checkbox-tile">
          <input type="checkbox" name="member_ids" value="{{ member.id }}" />
          <h3>{{ member.name }}</h3>
          <p class="badge">Up to {{ member.max_rating }}</p>
        </label>
      {% endfor %}
    </div>

    <h2>What's the mood?</h2>
    <div class="mood-grid">
      {% for key, mood in moods.items() %}
        <label class="mood-tile">
          <input type="radio" name="mood" value="{{ key }}" {% if loop.first %}checked{% endif %} />
          {{ mood.label }}
        </label>
      {% endfor %}
    </div>

    <fieldset class="filters">
      <legend>Filters (optional)</legend>
      <label>Minimum rating
        <select name="min_rating">
          <option value="">Any</option>
          <option value="6">6+</option>
          <option value="7">7+</option>
          <option value="8">8+</option>
        </select>
      </label>
      <label>Released from
        <input type="number" name="year_from" min="1900" max="2030" placeholder="e.g. 2015" />
      </label>
      <label>Released to
        <input type="number" name="year_to" min="1900" max="2030" placeholder="e.g. 2026" />
      </label>
    </fieldset>

    <button class="btn" type="submit">Find movies</button>
  </form>
</section>
{% endblock %}
